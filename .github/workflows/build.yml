name: Build mod

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Gradle-проект лежит в pvpbot-fabric-1.21.1/pvpbot
    defaults:
      run:
        working-directory: pvpbot-fabric-1.21.1/pvpbot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # gradlew в проекте нет, поэтому ставим Gradle сами
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      # При падении сборки выводим ошибки компиляции одной аннотацией (видна на странице запуска)
      - name: Report build errors
        if: failure()
        run: |
          errs=$(grep -E -A3 "error:|What went wrong" build.log | grep -v '^--$' | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle build errors::${errs}"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: pvpbot-fabric-1.21.1
          path: |
            pvpbot-fabric-1.21.1/pvpbot/build/libs/*.jar
            !pvpbot-fabric-1.21.1/pvpbot/build/libs/*-sources.jar
          if-no-files-found: error
