name: Build mod

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pvpbot-fabric-1.21.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Ставим Gradle сами, т.к. в проекте нет gradlew
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Show project files
        run: ls -la

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: pvpbot-fabric-1.21.1
          path: pvpbot-fabric-1.21.1/build/libs/*.jar
          if-no-files-found: error
